<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Software Engineer & AI Researcher</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Navigation Component ---
        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav class={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${scrolled ? 'bg-slate-900/80 backdrop-blur-md border-b border-slate-800 py-4' : 'bg-transparent py-6'}`}>
                    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
                        <a href="#" class="text-xl font-bold bg-gradient-to-r from-teal-400 to-emerald-400 bg-clip-text text-transparent">
                            DevPortfolio
                        </a>
                        <div class="flex gap-8 text-sm font-medium text-slate-300">
                            <a href="#about" class="hover:text-teal-400 transition-colors">About</a>
                            <a href="#skills" class="hover:text-teal-400 transition-colors">Skills</a>
                            <a href="#projects" class="hover:text-teal-400 transition-colors">Projects</a>
                            <a href="#contact" class="hover:text-teal-400 transition-colors">Contact</a>
                        </div>
                    </div>
                </nav>
            );
        };

        // --- Hero / About Section ---
        const Hero = () => {
            return (
                <section id="about" class="min-h-screen pt-32 pb-20 flex items-center justify-center relative overflow-hidden">
                    <div class="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-12 gap-12 items-center">
                        <div class="md:col-span-7 space-y-6">
                            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-teal-500/10 border border-teal-500/20 text-teal-400 text-xs font-semibold uppercase tracking-wider">
                                Available for opportunities
                            </div>
                            <h1 class="text-4xl md:text-6xl font-extrabold text-white leading-tight">
                                Building scalable solutions with <span class="bg-gradient-to-r from-teal-400 via-emerald-400 to-cyan-400 bg-clip-text text-transparent">AI & Full-Stack</span> engineering.
                            </h1>
                            <p class="text-slate-400 text-lg leading-relaxed">
                                Software engineer specializing in machine learning pipelines, system architecture, and intelligent application design. Passionate about turning complex algorithms into seamless user experiences.
                            </p>
                            <div class="flex flex-wrap gap-4 pt-4">
                                <a href="#projects" class="px-6 py-3 rounded-lg bg-teal-500 text-slate-950 font-semibold hover:bg-teal-400 transition-colors shadow-lg shadow-teal-500/20">
                                    View Projects
                                </a>
                                <a href="#contact" class="px-6 py-3 rounded-lg border border-slate-700 text-slate-300 font-semibold hover:bg-slate-800 transition-colors">
                                    Get in Touch
                                </a>
                            </div>
                        </div>
                        <div class="md:col-span-5 flex justify-center">
                            <div class="relative group">
                                <div class="absolute -inset-1 rounded-2xl bg-gradient-to-r from-teal-500 to-emerald-500 opacity-30 blur-lg group-hover:opacity-50 transition duration-500"></div>
                                <div class="relative rounded-2xl overflow-hidden border border-slate-800 bg-slate-900 w-72 h-96 md:w-80 md:h-[26rem] shadow-2xl">
                                    <img 
                                        src="1000252323-2.jpg" 
                                        alt="Profile Photo" 
                                        class="w-full h-full object-cover object-top transition duration-500 group-hover:scale-105"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // --- Skills Section ---
        const Skills = () => {
            const categories = [
                {
                    title: "Machine Learning & AI",
                    skills: ["PyTorch", "TensorFlow", "Multimodal AI", "Predictive Maintenance", "Computer Vision"]
                },
                {
                    title: "Full-Stack Development",
                    skills: ["Python", "React", "TypeScript", "Node.js", "REST APIs", "Tailwind CSS"]
                },
                {
                    title: "Systems & Architecture",
                    skills: ["IoT Integration", "System Architecture", "Maximo Integration", "SQL/NoSQL", "Docker"]
                }
            ];

            return (
                <section id="skills" class="py-20 bg-slate-900/50 border-y border-slate-800">
                    <div class="max-w-6xl mx-auto px-6">
                        <h2 class="text-3xl font-bold text-white mb-12 text-center">Core Capabilities</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {categories.map((cat, idx) => (
                                <div key={idx} class="p-6 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 transition-all">
                                    <h3 class="text-xl font-semibold text-teal-400 mb-4">{cat.title}</h3>
                                    <ul class="space-y-2">
                                        {cat.skills.map((skill, sIdx) => (
                                            <li key={sIdx} class="flex items-center gap-2 text-slate-300">
                                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                                {skill}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // --- Projects Section ---
        const Projects = () => {
            const projectList = [
                {
                    title: "Intelligence Surveillance & Border Security",
                    description: "Multimodal AI pipeline processing IoT sensor feeds and computer vision streams for real-time situational awareness and threat detection.",
                    tags: ["PyTorch", "IoT", "Multimodal Fusion", "Python"],
                    link: "#"
                },
                {
                    title: "Predictive Maintenance Hub",
                    description: "Data hub integrating Maximo enterprise asset management with IoT stream analytics for asset failure prediction.",
                    tags: ["System Architecture", "Predictive AI", "React", "Maximo"],
                    link: "#"
                },
                {
                    title: "Legal Domain Translator",
                    description: "NLP application tailored to simplify legal terminology and constitutional frameworks into structured, actionable insights.",
                    tags: ["LLMs", "NLP", "React", "Tailwind"],
                    link: "#"
                }
            ];

            return (
                <section id="projects" class="py-20">
                    <div class="max-w-6xl mx-auto px-6">
                        <h2 class="text-3xl font-bold text-white mb-12 text-center">Featured Work</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {projectList.map((proj, idx) => (
                                <div key={idx} class="rounded-xl border border-slate-800 bg-slate-900 overflow-hidden flex flex-col hover:border-slate-700 transition-all">
                                    <div class="p-6 flex-1 flex flex-col">
                                        <h3 class="text-xl font-bold text-white mb-3">{proj.title}</h3>
                                        <p class="text-slate-400 text-sm leading-relaxed mb-6 flex-1">{proj.description}</p>
                                        <div class="flex flex-wrap gap-2 mb-6">
                                            {proj.tags.map((tag, tIdx) => (
                                                <span key={tIdx} class="px-2.5 py-1 text-xs rounded bg-slate-800 text-teal-300 font-medium">
                                                    {tag}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // --- Footer / Contact ---
        const Footer = () => {
            return (
                <footer id="contact" class="py-12 bg-slate-950 border-t border-slate-800 text-center">
                    <div class="max-w-6xl mx-auto px-6 space-y-6">
                        <h2 class="text-2xl font-bold text-white">Let's Connect</h2>
                        <p class="text-slate-400 max-w-md mx-auto">Open to software engineering and AI engineering opportunities.</p>
                        <div class="pt-4 text-xs text-slate-500">
                            © {new Date().getFullYear()} All rights reserved.
                        </div>
                    </div>
                </footer>
            );
        };

        // --- Main App ---
        const App = () => {
            useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <div class="min-h-screen bg-slate-950">
                    <Navbar />
                    <Hero />
                    <Skills />
                    <Projects />
                    <Footer />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
